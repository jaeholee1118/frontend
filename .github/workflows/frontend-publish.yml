name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # 수동 실행 시 빌드할 태그를 입력받도록 추가
    inputs:
      target_ref:
        description: '빌드할 태그나 브랜치 이름 (예: v2.6.0)'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 방금 입력받은 태그(target_ref)의 코드를 체크아웃 하도록 설정!
          ref: ${{ github.event.inputs.target_ref }} 

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 태그를 수동으로 지정 (예: ghcr.io/계정명/frontend:v2.6.0)
          tags: |
            type=raw,value=${{ github.event.inputs.target_ref }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
