name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*' # v2.6.0 처럼 태그를 달아 푸시하면 자동 실행
  workflow_dispatch: # Actions 탭에서 수동으로 실행할 수 있는 버튼 생성

env:
  REGISTRY: ghcr.io
  # github.repository는 '본인계정/frontend' 형태로 자동 치환됩니다.
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR에 패키지를 업로드할 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 설정 없이 자동 제공되는 토큰 사용

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
